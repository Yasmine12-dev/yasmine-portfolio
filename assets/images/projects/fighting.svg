<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Press Start 2P', Consolas, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="0.5" stop-color="#7a2f6b"/>
      <stop offset="0.85" stop-color="#f07a4a"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3a29"/>
      <stop offset="1" stop-color="#2a1a12"/>
    </linearGradient>
    <linearGradient id="hp1" x1="0" x2="1"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <linearGradient id="hp2" x1="1" x2="0"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff2c4"/><stop offset="1" stop-color="#ffb25b" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- window -->
  <rect width="1600" height="1000" fill="#111"/>
  <rect width="1600" height="36" fill="#202124"/>
