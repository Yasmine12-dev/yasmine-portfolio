    <line x1="800" y1="740" x2="800" y2="1000"/><line x1="500" y1="740" x2="300" y2="1000"/><line x1="1100" y1="740" x2="1300" y2="1000"/><line x1="200" y1="740" x2="-100" y2="1000"/><line x1="1400" y1="740" x2="1700" y2="1000"/>
  </g>
