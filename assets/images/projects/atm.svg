    <text x="404" y="112"><tspan fill="#c586c0">#include</tspan><tspan fill="#ce9178"> &lt;stdio.h&gt;</tspan></text>
    <text x="404" y="138"><tspan fill="#c586c0">#include</tspan><tspan fill="#ce9178"> "account.h"</tspan></text>
    <text x="404" y="190"><tspan fill="#569cd6">int</tspan><tspan fill="#dcdcaa"> main</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#569cd6">void</tspan><tspan fill="#d4d4d4">) {</tspan></text>
    <text x="440" y="216"><tspan fill="#4ec9b0">Account</tspan><tspan fill="#9cdcfe"> acc</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#dcdcaa">load_account</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#ce9178">"accounts.txt"</tspan><tspan fill="#d4d4d4">);</tspan></text>
    <text x="440" y="242"><tspan fill="#569cd6">int</tspan><tspan fill="#9cdcfe"> choice</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="440" y="294"><tspan fill="#c586c0">if</tspan><tspan fill="#d4d4d4"> (!</tspan><tspan fill="#dcdcaa">authenticate</tspan><tspan fill="#d4d4d4">(&amp;</tspan><tspan fill="#9cdcfe">acc</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#d4d4d4">))</tspan></text>
    <text x="476" y="320"><tspan fill="#c586c0">return</tspan><tspan fill="#b5cea8"> 1</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="440" y="346"><tspan fill="#c586c0">do</tspan><tspan fill="#d4d4d4"> {</tspan></text>
    <text x="476" y="372"><tspan fill="#9cdcfe">choice</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#dcdcaa">show_menu</tspan><tspan fill="#d4d4d4">();</tspan></text>
    <text x="476" y="398"><tspan fill="#c586c0">switch</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#9cdcfe">choice</tspan><tspan fill="#d4d4d4">) {</tspan></text>
    <text x="512" y="424"><tspan fill="#c586c0">case</tspan><tspan fill="#b5cea8"> 1</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#dcdcaa">show_balance</tspan><tspan fill="#d4d4d4">(&amp;</tspan><tspan fill="#9cdcfe">acc</tspan><tspan fill="#d4d4d4">); </tspan><tspan fill="#c586c0">break</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="512" y="450"><tspan fill="#c586c0">case</tspan><tspan fill="#b5cea8"> 2</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#dcdcaa">deposit</tspan><tspan fill="#d4d4d4">(&amp;</tspan><tspan fill="#9cdcfe">acc</tspan><tspan fill="#d4d4d4">); </tspan><tspan fill="#c586c0">break</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="512" y="476"><tspan fill="#c586c0">case</tspan><tspan fill="#b5cea8"> 3</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#dcdcaa">withdraw</tspan><tspan fill="#d4d4d4">(&amp;</tspan><tspan fill="#9cdcfe">acc</tspan><tspan fill="#d4d4d4">); </tspan><tspan fill="#c586c0">break</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="476" y="502"><tspan fill="#d4d4d4">}</tspan></text>
    <text x="440" y="528"><tspan fill="#d4d4d4">} </tspan><tspan fill="#c586c0">while</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#9cdcfe">choice</tspan><tspan fill="#d4d4d4"> != </tspan><tspan fill="#b5cea8">4</tspan><tspan fill="#d4d4d4">);</tspan></text>
    <rect x="403" y="514" width="2" height="20" fill="#aeafad"/>
