<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#e5e7eb"/>
  <!-- browser -->
  <rect width="1600" height="92" fill="#eef0f4"/>
  <circle cx="30" cy="26" r="7" fill="#ff5f57"/><circle cx="54" cy="26" r="7" fill="#febc2e"/><circle cx="78" cy="26" r="7" fill="#28c840"/>
  <path d="M120 52 V22 a8 8 0 0 1 8 -8 H340 a8 8 0 0 1 8 8 V52 Z" fill="#ffffff"/>
  <rect x="136" y="25" width="14" height="14" rx="7" fill="#10b981"/>
  <text x="160" y="37" font-size="14" fill="#334155">Time Manager</text>
  <rect x="0" y="52" width="1600" height="40" fill="#ffffff"/>
  <rect x="110" y="58" width="1380" height="28" rx="14" fill="#f1f3f7"/>
  <text x="134" y="77" font-size="14" fill="#64748b">localhost:8080/dashboard</text>
  <!-- app header -->
  <rect x="0" y="92" width="1600" height="70" fill="#ffffff"/>
  <line x1="0" x2="1600" y1="162" y2="162" stroke="#e5e7eb"/>
  <circle cx="44" cy="127" r="16" fill="none" stroke="#10b981" stroke-width="4"/><path d="M44 117 V127 L51 132" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="72" y="134" font-size="21" font-weight="700" fill="#0f172a">Time Manager</text>
  <g font-size="15"><text x="300" y="133" fill="#10b981" font-weight="600">Dashboard</text><text x="410" y="133" fill="#64748b">Working times</text><text x="540" y="133" fill="#64748b">Teams</text><text x="620" y="133" fill="#64748b">Users</text></g>
  <rect x="296" y="158" width="86" height="4" rx="2" fill="#10b981"/>
  <circle cx="1440" cy="127" r="18" fill="#d1fae5"/><text x="1440" y="133" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">JD</text>
  <text x="1468" y="124" font-size="14" fill="#0f172a" font-weight="600">Jane Doe</text><text x="1468" y="142" font-size="12" fill="#64748b">Manager</text>
  <!-- page -->
  <rect x="0" y="163" width="1600" height="837" fill="#f6f7f9"/>
  <text x="60" y="222" font-size="28" font-weight="700" fill="#0f172a">Good morning, Jane</text>
  <text x="60" y="250" font-size="15" fill="#64748b">Tuesday, 24 November · Week 48</text>
  <!-- clock card -->
  <rect x="60" y="280" width="440" height="300" rx="16" fill="url(#hero)" filter="url(#sh)"/>
  <text x="90" y="326" font-size="15" fill="#d1fae5">Clocked in since 08:52</text>
  <text x="90" y="410" font-size="72" font-weight="700" fill="#ffffff">03:41:27</text>
  <text x="90" y="446" font-size="15" fill="#d1fae5">Today’s working time</text>
  <rect x="90" y="486" width="180" height="54" rx="27" fill="#ffffff"/>
  <rect x="122" y="505" width="16" height="16" rx="3" fill="#dc2626"/>
  <text x="150" y="519" font-size="17" font-weight="700" fill="#0f172a">Clock out</text>
  <circle cx="430" cy="350" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8"/>
  <circle cx="430" cy="350" r="34" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="98 214" transform="rotate(-90 430 350)" stroke-linecap="round"/>
  <!-- weekly chart -->
  <rect x="530" y="280" width="610" height="300" rx="16" fill="#ffffff" filter="url(#sh)"/>
  <text x="560" y="320" font-size="17" font-weight="600" fill="#0f172a">Hours this week</text>
  <text x="1110" y="320" font-size="14" fill="#64748b" text-anchor="end">31.5 h / 35 h</text>
  <g stroke="#f1f5f9"><line x1="560" x2="1110" y1="360" y2="360"/><line x1="560" x2="1110" y1="420" y2="420"/><line x1="560" x2="1110" y1="480" y2="480"/><line x1="560" x2="1110" y1="540" y2="540"/></g>
  <line x1="560" x2="1110" y1="400" y2="400" stroke="#f59e0b" stroke-dasharray="6 5" stroke-width="2"/>
  <g fill="#10b981">
    <rect x="590" y="392" width="54" height="148" rx="8"/>
    <rect x="690" y="380" width="54" height="160" rx="8"/>
    <rect x="790" y="404" width="54" height="136" rx="8"/>
    <rect x="890" y="396" width="54" height="144" rx="8"/>
    <rect x="990" y="476" width="54" height="64" rx="8" fill="#a7f3d0"/>
  </g>
  <g font-size="13" fill="#64748b" text-anchor="middle"><text x="617" y="564">Mon</text><text x="717" y="564">Tue</text><text x="817" y="564">Wed</text><text x="917" y="564">Thu</text><text x="1017" y="564">Fri</text></g>
  <!-- stats -->
  <rect x="1170" y="280" width="370" height="140" rx="16" fill="#ffffff" filter="url(#sh)"/>
  <text x="1200" y="322" font-size="14" fill="#64748b">Team members working</text>
  <text x="1200" y="378" font-size="40" font-weight="700" fill="#0f172a">8<tspan font-size="22" fill="#94a3b8"> / 11</tspan></text>
  <g><circle cx="1440" cy="360" r="16" fill="#fde68a"/><circle cx="1464" cy="360" r="16" fill="#bfdbfe"/><circle cx="1488" cy="360" r="16" fill="#fbcfe8"/><circle cx="1512" cy="360" r="16" fill="#e2e8f0"/><text x="1512" y="365" font-size="11" text-anchor="middle" fill="#475569">+5</text></g>
  <rect x="1170" y="440" width="370" height="140" rx="16" fill="#ffffff" filter="url(#sh)"/>
  <text x="1200" y="482" font-size="14" fill="#64748b">Average daily hours</text>
  <text x="1200" y="538" font-size="40" font-weight="700" fill="#0f172a">7.6 h</text>
  <text x="1350" y="538" font-size="14" fill="#16a34a">▲ 0.4 h vs last week</text>
  <!-- table -->
  <rect x="60" y="610" width="1480" height="360" rx="16" fill="#ffffff" filter="url(#sh)"/>
  <text x="90" y="652" font-size="17" font-weight="600" fill="#0f172a">Team activity</text>
  <rect x="1380" y="630" width="130" height="36" rx="8" fill="#ecfdf5"/><text x="1445" y="654" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">Export CSV</text>
  <rect x="60" y="680" width="1480" height="40" fill="#f8fafc"/>
  <g font-size="13" font-weight="600" fill="#64748b"><text x="90" y="705">EMPLOYEE</text><text x="460" y="705">TEAM</text><text x="700" y="705">CLOCK IN</text><text x="900" y="705">CLOCK OUT</text><text x="1100" y="705">TOTAL</text><text x="1300" y="705">STATUS</text></g>
  <g font-size="15" fill="#1e293b">
    <circle cx="106" cy="756" r="16" fill="#fde68a"/><text x="134" y="761">Alex Martin</text><text x="460" y="761">Frontend</text><text x="700" y="761">08:30</text><text x="900" y="761" fill="#94a3b8">—</text><text x="1100" y="761">4h 03m</text>
    <rect x="1300" y="742" width="90" height="28" rx="14" fill="#dcfce7"/><text x="1345" y="761" font-size="13" fill="#15803d" text-anchor="middle" font-weight="600">Working</text>
    <line x1="90" x2="1510" y1="792" y2="792" stroke="#f1f5f9"/>
    <circle cx="106" cy="826" r="16" fill="#bfdbfe"/><text x="134" y="831">Sara Benali</text><text x="460" y="831">Backend</text><text x="700" y="831">09:05</text><text x="900" y="831" fill="#94a3b8">—</text><text x="1100" y="831">3h 28m</text>
    <rect x="1300" y="812" width="90" height="28" rx="14" fill="#dcfce7"/><text x="1345" y="831" font-size="13" fill="#15803d" text-anchor="middle" font-weight="600">Working</text>
    <line x1="90" x2="1510" y1="862" y2="862" stroke="#f1f5f9"/>
    <circle cx="106" cy="896" r="16" fill="#fbcfe8"/><text x="134" y="901">Tom Leroy</text><text x="460" y="901">DevOps</text><text x="700" y="901">07:45</text><text x="900" y="901">11:50</text><text x="1100" y="901">4h 05m</text>
    <rect x="1300" y="882" width="90" height="28" rx="14" fill="#f1f5f9"/><text x="1345" y="901" font-size="13" fill="#475569" text-anchor="middle" font-weight="600">On break</text>
  </g>
</svg>
